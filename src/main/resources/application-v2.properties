# V2 secure-review persistence. Credentials are injected by the environment;
# never commit a production password or JWT secret to source control.
spring.autoconfigure.exclude=
spring.datasource.url=${CONTENT_FILTER_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/contentfilter}
spring.datasource.username=${CONTENT_FILTER_DATABASE_USERNAME:contentfilter}
spring.datasource.password=${CONTENT_FILTER_DATABASE_PASSWORD:contentfilter}
spring.datasource.hikari.maximum-pool-size=${CONTENT_FILTER_DATABASE_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${CONTENT_FILTER_DATABASE_MIN_IDLE:1}

# Flyway is the sole schema writer. Hibernate validates mappings once entities
# are introduced by later V2 modules.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# V2 authentication. The JWT secret must be at least 32 bytes; startup fails
# without it. Tokens are short-lived because there is no revocation list yet.
content-filter.security.jwt.secret=${CONTENT_FILTER_JWT_SECRET:}
content-filter.security.jwt.issuer=${CONTENT_FILTER_JWT_ISSUER:contentfilter}
content-filter.security.jwt.access-token-ttl=${CONTENT_FILTER_JWT_TTL:30m}

# First administrator, created only while the account table is empty.
content-filter.security.bootstrap-admin.email=${CONTENT_FILTER_BOOTSTRAP_ADMIN_EMAIL:}
content-filter.security.bootstrap-admin.password=${CONTENT_FILTER_BOOTSTRAP_ADMIN_PASSWORD:}
