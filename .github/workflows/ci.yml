name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  model-evaluation:
    name: Python model contracts
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            model-service/requirements-api.txt
            model-service/requirements-test.txt

      - name: Install API contract-test dependencies
        run: python -m pip install -r model-service/requirements-test.txt

      - name: Validate evaluation dataset
        run: |
          python model-service/scripts/build_domain_dataset.py --check
          python model-service/scripts/validate_dataset.py

      - name: Run evaluation and API contract tests
        run: python -m pytest model-service/tests -q

      - name: Compile Python sources
        run: >-
          python -m py_compile
          model-service/scripts/build_domain_dataset.py
          model-service/scripts/evaluation_lib.py
          model-service/scripts/validate_dataset.py
          model-service/scripts/evaluate_predictions.py
          model-service/scripts/select_thresholds.py
          model-service/scripts/run_hf_evaluation.py
          model-service/app/settings.py
          model-service/app/schemas.py
          model-service/app/model_manifest.py
          model-service/app/runtime.py
          model-service/app/service.py
          model-service/app/main.py

  docker:
    name: Docker build and compose smoke test
    runs-on: ubuntu-latest
    needs: [java, model-evaluation]
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds contentfilter-api (root Dockerfile) and contentfilter-model
      # (model-service/Dockerfile, which downloads the pinned model during
      # build) exactly as compose.yaml defines them. This is the step that
      # would have caught a broken build context or a Python error in the
      # model-download stage before it reached a real deployment.
      - name: Build both service images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      # Readiness only reports UP once the database is healthy, the model
      # service has finished loading the pinned model, and the API's
      # fastApiModel health indicator can reach it — so this is a real
      # end-to-end check, not just "did the process start".
      - name: Wait for the API to report ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health/readiness; then
              echo
              echo "API is ready."
              exit 0
            fi
            echo "Waiting for readiness... (${i}/60)"
            sleep 10
          done
          echo "API never became ready within the time budget." >&2
          exit 1

      # Proves the V2 path end to end: Flyway migrated the database, the
      # bootstrap admin exists, and the API issues a signed access token.
      - name: Log in as the bootstrap admin
        run: |
          curl -fsS -X POST http://localhost:8080/api/v2/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@contentfilter.local","password":"dev-only-admin-password"}' \
            | grep -q '"accessToken"'
          echo "V2 login succeeded."

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  java:
    name: Java verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile, test, and package
        run: ./mvnw --batch-mode --no-transfer-progress verify
